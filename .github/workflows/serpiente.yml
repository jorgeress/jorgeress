name: serpiente

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/serpiente.yml]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente.svg?palette=github-light&color_snake=#c792ea
            dist/serpiente-oscura.svg?palette=github-dark&color_snake=#c792ea

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Actualiza la serpiente
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
